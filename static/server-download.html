<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>服务器下发文件</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 28px 20px;
      background: #F7F8FA;
      color: #1F2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .panel {
      padding: 24px;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      background: #FFFFFF;
    }

    .title {
      margin-bottom: 8px;
      color: #111827;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }

    .desc {
      margin-bottom: 20px;
      color: #667085;
      font-size: 14px;
      line-height: 1.7;
    }

    .filename {
      margin-bottom: 12px;
      color: #111827;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #EEF2F7;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #16A34A;
      transition: width 180ms ease;
    }

    .progress-text {
      min-height: 22px;
      color: #475467;
      font-size: 13px;
      line-height: 1.6;
    }

    .error {
      color: #B42318;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="title" id="title">正在准备服务器下发文件</div>
      <div class="desc">请保持当前页面打开，完成后会自动返回小程序。</div>
      <div class="filename" id="filename"></div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">初始化中...</div>
    </section>
  </div>

  <script>
    // 独立服务器下发文件桥页：
    // 1. 小程序只把短期凭据票据放在 location.hash，静态托管和 Referer 不会记录它。
    // 2. 页面换取短期访问凭据后，在当前用户出口获取真实下载地址并立即拉取文件。
    // 3. 文件仍按成熟 WebView 协议分片回传；任一环节失败由小程序自动回落备用线路。
    const CHUNK_SIZE = 1024 * 1024;
    const DEFAULT_TIMEOUT_MS = 5 * 60 * 1000;
    const state = {
      transferId: '',
      sequence: 0,
      fileName: 'download.bin',
      fileType: 'application/octet-stream',
      expectedSize: 0,
      downloadSlotLeaseId: '',
      downloadSlotReleaseUrl: ''
    };

    class UnauthorizedCredentialError extends Error {
      constructor(message) {
        super(message || '服务器凭据已失效');
        this.name = 'UnauthorizedCredentialError';
      }
    }

    class DownloadSlotBusyError extends Error {
      constructor(message, active, limit, retryAfterSeconds) {
        super(message || '当前下载人数较多，正在等待空闲通道');
        this.name = 'DownloadSlotBusyError';
        this.active = normalizePositiveInteger(active, 0);
        this.limit = normalizePositiveInteger(limit, 5);
        this.retryAfterSeconds = normalizePositiveInteger(retryAfterSeconds, 2);
      }
    }

    function parseHashParams() {
      const raw = window.location.hash.replace(/^#/, '');
      const params = {};
      raw.split('&').filter(Boolean).forEach(part => {
        const index = part.indexOf('=');
        const key = index >= 0 ? part.slice(0, index) : part;
        const value = index >= 0 ? part.slice(index + 1) : '';
        try {
          params[decodeURIComponent(key)] = decodeURIComponent(value);
        } catch (error) {
          params[key] = value;
        }
      });
      return params;
    }

    function clearSensitiveHash() {
      try {
        // hash 读取后立即从地址栏和后续截图/复制链接中移除。history.replaceState
        // 不会重新加载静态页，也不会影响当前脚本持有的内存参数。
        history.replaceState(null, document.title, `${location.pathname}${location.search}`);
      } catch (error) {
        location.hash = '';
      }
    }

    function normalizePositiveInteger(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
    }

    function waitWithSignal(delayMs, signal) {
      return new Promise((resolve, reject) => {
        if (signal && signal.aborted) {
          reject(new DOMException('Aborted', 'AbortError'));
          return;
        }
        const onAbort = () => {
          clearTimeout(timer);
          if (signal) {
            signal.removeEventListener('abort', onAbort);
          }
          reject(new DOMException('Aborted', 'AbortError'));
        };
        const timer = setTimeout(() => {
          if (signal) {
            signal.removeEventListener('abort', onAbort);
          }
          resolve();
        }, delayMs);
        if (signal) {
          signal.addEventListener('abort', onAbort, { once: true });
        }
      });
    }

    function updateStatus(text, progress, isError) {
      const titleEl = document.getElementById('title');
      const textEl = document.getElementById('progressText');
      const barEl = document.getElementById('progressBar');
      textEl.textContent = text;
      textEl.className = isError ? 'progress-text error' : 'progress-text';
      if (isError) {
        titleEl.textContent = '下载失败';
      }
      if (typeof progress === 'number' && Number.isFinite(progress)) {
        barEl.style.width = `${Math.max(0, Math.min(100, progress))}%`;
      }
    }

    function postMiniProgramMessage(data) {
      wx.miniProgram.postMessage({
        data: {
          ...data,
          transferId: state.transferId,
          sequence: state.sequence++,
          sentAt: Date.now()
        }
      });
    }

    function navigateBackToMiniProgram() {
      setTimeout(() => {
        try {
          wx.miniProgram.navigateBack();
        } catch (error) {
          updateStatus('请手动返回小程序继续', undefined, false);
        }
      }, 200);
    }

    function failAndReturn(message) {
      const errorMessage = String(message || '服务器下发文件失败');
      console.error('[server-download]', errorMessage);
      updateStatus(errorMessage, undefined, true);
      postMiniProgramMessage({
        type: 'serverDownloadError',
        fileName: state.fileName,
        error: errorMessage
      });
      postMiniProgramMessage({
        type: 'filesEnd',
        total: 1,
        totalFiles: 1,
        successCount: 0,
        failedCount: 1,
        failedFiles: [state.fileName]
      });
      navigateBackToMiniProgram();
    }

    function readBlobAsBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = event => {
          const result = String(event.target && event.target.result || '');
          const commaIndex = result.indexOf(',');
          resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
        };
        reader.onerror = () => reject(new Error('读取下载分片失败'));
        reader.readAsDataURL(blob);
      });
    }

    async function sendChunk(fileId, chunkIndex, totalChunks, blob, writtenBytes, totalBytes) {
      const chunkData = await readBlobAsBase64(blob);
      postMiniProgramMessage({
        type: 'chunkData',
        fileId,
        chunkIndex,
        totalChunks,
        fileIndex: 0,
        totalFiles: 1,
        data: chunkData
      });
      const progress = totalBytes > 0 ? Math.round((writtenBytes / totalBytes) * 100) : 0;
      updateStatus(totalBytes > 0 ? `下载中 ${progress}%` : '下载中...', progress, false);
      // WebView postMessage 大量排队时需要给 UI 和桥接层一点调度时间。
      await new Promise(resolve => setTimeout(resolve, 20));
    }

    async function sendBlobInChunks(fileId, blob, totalBytes) {
      if (totalBytes > 0 && blob.size !== totalBytes) {
        throw new Error(`下载文件大小校验失败: 预期 ${totalBytes} 字节，实际 ${blob.size} 字节`);
      }
      const totalChunks = Math.max(1, Math.ceil(blob.size / CHUNK_SIZE));
      postMiniProgramMessage({
        type: 'chunkStart',
        fileId,
        fileName: state.fileName,
        fileSize: totalBytes || blob.size,
        fileType: state.fileType,
        totalChunks,
        fileIndex: 0,
        totalFiles: 1
      });

      for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
        const start = chunkIndex * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, blob.size);
        await sendChunk(fileId, chunkIndex, totalChunks, blob.slice(start, end), end, totalBytes || blob.size);
      }
    }

    function concatBytes(left, right) {
      if (!left || left.length === 0) {
        return right;
      }
      if (!right || right.length === 0) {
        return left;
      }
      const merged = new Uint8Array(left.length + right.length);
      merged.set(left, 0);
      merged.set(right, left.length);
      return merged;
    }

    async function sendResponseStreamInChunks(fileId, response, totalBytes) {
      if (!response.body || typeof response.body.getReader !== 'function' || totalBytes <= 0) {
        const blob = await response.blob();
        await sendBlobInChunks(fileId, blob, totalBytes || blob.size);
        return;
      }

      const reader = response.body.getReader();
      const totalChunks = Math.max(1, Math.ceil(totalBytes / CHUNK_SIZE));
      let pending = new Uint8Array(0);
      let received = 0;
      let sent = 0;

      postMiniProgramMessage({
        type: 'chunkStart',
        fileId,
        fileName: state.fileName,
        fileSize: totalBytes,
        fileType: state.fileType,
        totalChunks,
        fileIndex: 0,
        totalFiles: 1
      });

      while (true) {
        const result = await reader.read();
        if (result.done) {
          break;
        }
        const value = result.value;
          if (value && value.length) {
            received += value.length;
            if (received > totalBytes) {
              throw new Error(`下载文件大小校验失败: 已接收 ${received} 字节，超过预期 ${totalBytes} 字节`);
            }
            pending = concatBytes(pending, value);
          const progress = totalBytes > 0 ? Math.round((received / totalBytes) * 100) : 0;
          updateStatus(totalBytes > 0 ? `下载中 ${progress}%` : '下载中...', progress, false);
          while (pending.length >= CHUNK_SIZE) {
            const chunk = pending.slice(0, CHUNK_SIZE);
            pending = pending.slice(CHUNK_SIZE);
            sent += chunk.length;
            await sendChunk(fileId, Math.floor((sent - chunk.length) / CHUNK_SIZE), totalChunks, new Blob([chunk], { type: state.fileType }), sent, totalBytes);
          }
        }
      }

      if (pending.length > 0 || sent === 0) {
        const chunkIndex = Math.floor(sent / CHUNK_SIZE);
        sent += pending.length;
        await sendChunk(fileId, chunkIndex, totalChunks, new Blob([pending], { type: state.fileType }), sent, totalBytes);
      }
      if (sent !== totalBytes) {
        throw new Error(`下载文件大小校验失败: 预期 ${totalBytes} 字节，实际 ${sent} 字节`);
      }
    }

    function unwrapApiData(payload, fallbackMessage) {
      if (!payload || typeof payload !== 'object') {
        throw new Error(fallbackMessage || '服务器响应格式无效');
      }
      const code = payload.code;
      if (payload.success === false || ![undefined, null, 0, '0', 200, '200'].includes(code)) {
        const message = payload.message || payload.msg || payload.detail || payload.error || fallbackMessage;
        if (Number(code) === 401) {
          throw new UnauthorizedCredentialError(String(message || '服务器凭据已失效'));
        }
        throw new Error(String(message || '服务器响应异常'));
      }
      return payload.data && typeof payload.data === 'object' ? payload.data : payload;
    }

    async function exchangeCredential(credentialUrl, credentialTicket, retryAfterUnauthorized, signal) {
      const response = await fetch(credentialUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ticket: credentialTicket,
          retryAfterUnauthorized: !!retryAfterUnauthorized
        }),
        credentials: 'omit',
        cache: 'no-store',
        signal
      });
      let payload = null;
      try {
        payload = await response.json();
      } catch (error) {
        payload = null;
      }
      if (response.status === 429) {
        const detail = payload && typeof payload.detail === 'object' ? payload.detail : {};
        throw new DownloadSlotBusyError(
          detail.message,
          detail.active,
          detail.limit,
          detail.retryAfterSeconds || response.headers.get('retry-after')
        );
      }
      if (!response.ok) {
        throw new Error(`服务器凭据响应异常: ${response.status}`);
      }
      const data = unwrapApiData(payload, '服务器凭据响应异常');
      const accessToken = String(data.accessToken || data.access_token || '').trim();
      const downloadInfoUrl = String(data.downloadInfoUrl || data.download_info_url || '').trim();
      const fileId = Number(data.fileId || data.file_id || 0);
      const downloadSlotLeaseId = String(data.downloadSlotLeaseId || '').trim();
      if (!accessToken || !/^https:\/\//i.test(downloadInfoUrl) || !Number.isFinite(fileId) || fileId <= 0 || !downloadSlotLeaseId) {
        throw new Error('服务器下发凭据信息不完整');
      }
      return {
        accessToken,
        downloadInfoUrl,
        fileId: Math.floor(fileId),
        filename: String(data.filename || state.fileName || 'download.bin'),
        size: normalizePositiveInteger(data.size, state.expectedSize),
        downloadSlotLeaseId,
        downloadSlotReleaseUrl: new URL(
          '/api/cloud-download/pan123-h5-download-slot/release',
          credentialUrl
        ).toString()
      };
    }

    async function exchangeCredentialWhenSlotAvailable(
      credentialUrl,
      credentialTicket,
      retryAfterUnauthorized,
      signal
    ) {
      while (true) {
        try {
          return await exchangeCredential(
            credentialUrl,
            credentialTicket,
            retryAfterUnauthorized,
            signal
          );
        } catch (error) {
          if (!error || error.name !== 'DownloadSlotBusyError') {
            throw error;
          }
          const capacity = error.active > 0 ? `（${error.active}/${error.limit}）` : '';
          updateStatus(`当前下载人数较多，正在等待空闲通道${capacity}...`, 0, false);
          await waitWithSignal(error.retryAfterSeconds * 1000, signal);
        }
      }
    }

    function applyCredentialMetadata(credential) {
      // 文件名和大小以 Server 验过权限后签入票据的事实为准。hash 中的值只用于首屏展示，
      // 不能在凭据交换成功后继续覆盖 Server 元数据。
      state.fileName = String(credential.filename || state.fileName || 'download.bin').trim() || 'download.bin';
      state.expectedSize = normalizePositiveInteger(credential.size, state.expectedSize);
      state.downloadSlotLeaseId = credential.downloadSlotLeaseId;
      state.downloadSlotReleaseUrl = credential.downloadSlotReleaseUrl;
      document.getElementById('filename').textContent = state.fileName;
    }

    async function releaseDownloadSlot(options) {
      const leaseId = state.downloadSlotLeaseId;
      const releaseUrl = state.downloadSlotReleaseUrl;
      if (!leaseId || !/^https:\/\//i.test(releaseUrl)) {
        return;
      }

      // Clear ownership before sending so normal completion and pagehide cannot
      // release the same lease twice. The Server endpoint is also idempotent.
      state.downloadSlotLeaseId = '';
      state.downloadSlotReleaseUrl = '';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        await fetch(releaseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ leaseId }),
          credentials: 'omit',
          cache: 'no-store',
          keepalive: !!(options && options.keepalive),
          signal: controller.signal
        });
      } catch (error) {
        // A bounded lease is the recovery path for closed pages and transient
        // network errors. Release failure must not invalidate a completed file.
        console.warn('[server-download] 释放下载通道失败，将等待服务器自动回收');
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchDownloadInfo(credential, signal) {
      let lastError = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const separator = credential.downloadInfoUrl.includes('?') ? '&' : '?';
          const response = await fetch(
            `${credential.downloadInfoUrl}${separator}fileId=${encodeURIComponent(credential.fileId)}`,
            {
              method: 'GET',
              headers: {
                Authorization: `Bearer ${credential.accessToken}`,
                Platform: 'open_platform'
              },
              credentials: 'omit',
              cache: 'no-store',
              signal
            }
          );
          if (response.status === 401) {
            throw new UnauthorizedCredentialError('服务器凭据已失效');
          }
          if (!response.ok) {
            const retryable = response.status === 429 || response.status >= 500;
            if (retryable && attempt < 2) {
              await new Promise(resolve => setTimeout(resolve, 300 * (attempt + 1)));
              continue;
            }
            throw new Error(`下载信息响应异常: ${response.status}`);
          }
          const data = unwrapApiData(await response.json(), '下载信息响应异常');
          const downloadUrl = String(data.downloadUrl || data.download_url || data.url || '').trim();
          if (!/^https:\/\//i.test(downloadUrl)) {
            throw new Error('服务器未返回有效下载地址');
          }
          return {
            downloadUrl,
            size: normalizePositiveInteger(data.size, credential.size)
          };
        } catch (error) {
          lastError = error;
          if (error && error.name === 'UnauthorizedCredentialError') {
            throw error;
          }
          if (attempt < 2 && error && error.name !== 'AbortError') {
            await new Promise(resolve => setTimeout(resolve, 300 * (attempt + 1)));
            continue;
          }
          break;
        }
      }
      throw lastError || new Error('下载信息获取失败');
    }

    async function startDownload() {
      const params = parseHashParams();
      clearSensitiveHash();
      const credentialUrl = String(params.credentialUrl || '').trim();
      const credentialTicket = String(params.credentialTicket || '').trim();
      state.transferId = String(params.transferId || `server_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`);
      state.fileName = String(params.filename || 'download.bin').trim() || 'download.bin';
      state.fileType = String(params.fileType || 'application/octet-stream');
      state.expectedSize = normalizePositiveInteger(params.size, 0);
      const timeoutMs = normalizePositiveInteger(params.timeoutMs, DEFAULT_TIMEOUT_MS);

      document.getElementById('filename').textContent = state.fileName;

      if (params.mode !== 'serverCredentialDownload') {
        failAndReturn('下载桥参数无效');
        return;
      }
      if (!/^https:\/\//i.test(credentialUrl) || !credentialTicket) {
        failAndReturn('服务器凭据参数无效');
        return;
      }

      const controller = new AbortController();
      let timeoutTimer = setTimeout(() => controller.abort(), timeoutMs);
      const fileId = `server_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;

      try {
        updateStatus('正在获取服务器下发凭据...', 0, false);
        let credential = await exchangeCredentialWhenSlotAvailable(
          credentialUrl,
          credentialTicket,
          false,
          controller.signal
        );
        applyCredentialMetadata(credential);
        // Waiting for one of the five shared slots must not consume the actual
        // file-transfer budget. Once a slot is acquired, restart the same timeout
        // so a queued large file still receives a full download window.
        clearTimeout(timeoutTimer);
        timeoutTimer = setTimeout(() => controller.abort(), timeoutMs);
        let downloadInfo;
        try {
          downloadInfo = await fetchDownloadInfo(credential, controller.signal);
        } catch (error) {
          if (!error || error.name !== 'UnauthorizedCredentialError') {
            throw error;
          }
          // Server 可能刚在其它节点完成凭据轮换。只允许重新交换一次，并要求凭据
          // endpoint 打穿自己的 AT diskcache；第二次仍失败就交给小程序走备用线路。
          credential = await exchangeCredentialWhenSlotAvailable(
            credentialUrl,
            credentialTicket,
            true,
            controller.signal
          );
          applyCredentialMetadata(credential);
          downloadInfo = await fetchDownloadInfo(credential, controller.signal);
        }

        // download_info 完成后不再需要 AT。主动断开引用只能降低普通内存驻留时间，
        // 无法阻止用户通过调试代理查看自己设备上的网络请求，这是本方案已知边界。
        credential.accessToken = '';
        credential = null;

        updateStatus('正在连接下载线路...', 0, false);
        const response = await fetch(downloadInfo.downloadUrl, {
          method: 'GET',
          credentials: 'omit',
          cache: 'no-store',
          redirect: 'follow',
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error(`下载响应异常: ${response.status}`);
        }

        const headerSize = Number(response.headers.get('content-length') || 0);
        const totalBytes = downloadInfo.size
          || state.expectedSize
          || (Number.isFinite(headerSize) ? headerSize : 0);
        postMiniProgramMessage({ type: 'filesStart', total: 1, totalFiles: 1 });
        await sendResponseStreamInChunks(fileId, response, totalBytes);
        await releaseDownloadSlot();
        clearTimeout(timeoutTimer);
        postMiniProgramMessage({ type: 'chunkEnd', fileId, fileName: state.fileName, fileIndex: 0, totalFiles: 1 });
        postMiniProgramMessage({
          type: 'filesEnd',
          total: 1,
          totalFiles: 1,
          successCount: 1,
          failedCount: 0,
          failedFiles: []
        });
        updateStatus('传输完成，正在返回小程序...', 100, false);
        navigateBackToMiniProgram();
      } catch (error) {
        clearTimeout(timeoutTimer);
        await releaseDownloadSlot();
        const message = error && error.name === 'AbortError'
          ? 'H5 下载超时'
          : (error && error.message ? error.message : 'H5 下载失败');
        failAndReturn(message);
      }
    }

    window.addEventListener('pagehide', () => {
      void releaseDownloadSlot({ keepalive: true });
    });

    startDownload();
  </script>
</body>
</html>
