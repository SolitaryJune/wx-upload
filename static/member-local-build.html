<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>服务器下发文件</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f7;color:#172126;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .page{min-height:100vh;padding:22px 16px 34px}
    .panel{max-width:680px;margin:0 auto;background:#fff;border:1px solid #e1e7e9;border-radius:8px;padding:20px}
    h1{margin:0;font-size:21px;letter-spacing:0}
    .summary{margin:8px 0 18px;color:#66747a;font-size:13px;line-height:1.6}
    .overall{height:7px;background:#e7ecee;overflow:hidden}
    .overall i,.file-progress i{display:block;height:100%;width:0;background:#087d68;transition:width .2s}
    .status{margin:14px 0 0;padding:11px 12px;background:#eef6f3;color:#28574b;font-size:14px;line-height:1.6;white-space:pre-wrap}
    .status.error{background:#fff0f0;color:#9d2c2c}
    .files{margin-top:16px}
    .file{padding:12px 0;border-bottom:1px solid #edf0f1}
    .file:last-child{border-bottom:0}
    .file-name{font-size:14px;line-height:1.45;word-break:break-all}
    .file-meta{margin-top:5px;color:#748187;font-size:12px;line-height:1.45;word-break:break-all}
    .file-progress{height:5px;margin-top:8px;background:#e9edef;overflow:hidden}
  </style>
  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/spark-md5.min.js"></script>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>服务器下发文件</h1>
      <p id="summary" class="summary">正在读取文件计划，请保持页面开启。</p>
      <div class="overall"><i id="overallProgress"></i></div>
      <div id="status" class="status">正在连接服务...</div>
      <div id="files" class="files"></div>
    </section>
  </main>
  <script src="./member-local-build.js?v=2"></script>
</body>
</html>
